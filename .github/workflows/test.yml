name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Nub
        uses: nubjs/setup-nub@v0

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Install browsers
        run: nubx playwright install

      - name: Run tests
        run: nub run test
